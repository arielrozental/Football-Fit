<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חנות בגדים</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            direction: rtl;
        }

        header {
            background-color: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            border-radius: 5px;
        }

        .product-title {
            font-size: 1.2rem;
            margin: 15px 0 10px 0;
            font-weight: bold;
        }

        .buy-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: auto;
            transition: background-color 0.2s;
        }

        .buy-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>החנות שלי</h1>
        <p>קולקציית חולצות ומכנסיים</p>
    </header>

    <div class="container">
        <div class="products-grid">
            
            <!-- מוצר 1: מכנסיים -->
            <div class="product-card">
                <a href="https://ibb.co/Myx6xxwh" target="_blank">
                    <img src="https://i.ibb.co/p6ByBBVP/DE514-E19-3-C4-D-455-D-B53-B-1-A60-B0003521.jpg" alt="מכנסיים">
                </a>
                <div class="product-title">מכנסיים</div>
                <button class="buy-btn">לקנייה</button>
            </div>

            <!-- מוצר 2: חולצה -->
            <div class="product-card">
                <a href="https://ibb.co/rSvmvPh" target="_blank">
                    <img src="https://i.ibb.co/VZ3t3yG/IMG-6331.jpg" alt="חולצה שנייה">
                </a>
                <div class="product-title">חולצה</div>
                <button class="buy-btn">לקנייה</button>
            </div>

        </div>
    </div>

</body>
</html>
